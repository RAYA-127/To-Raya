<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dance Videos - Special Moments</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            font-family: 'Georgia', 'Arial', sans-serif;
            color: #fff;
            overflow-x: hidden;
            overflow-y: auto;
            padding: 40px 20px 100px;
        }

        /* Floating particles background */
        .particles-bg {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            pointer-events: none;
        }

        .particle-dot {
            position: absolute;
            width: 6px;
            height: 6px;
            background: radial-gradient(circle, #ff69b4, transparent);
            border-radius: 50%;
            animation: float-particle linear infinite;
            opacity: 0.4;
        }

        @keyframes float-particle {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* Main Header */
        .header-section {
            position: relative;
            z-index: 10;
            text-align: center;
            margin-bottom: 30px;
            animation: fade-in-down 0.9s ease-out;
        }

        @keyframes fade-in-down {
            from { opacity: 0; transform: translateY(-25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .page-title {
            font-size: 32px;
            font-weight: bold;
            color: #ff69b4;
            margin-bottom: 8px;
            text-shadow: 0 0 20px rgba(255, 105, 180, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .page-subtitle {
            font-size: 15px;
            color: #ddd;
            font-style: italic;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        /* View Filter Tabs */
        .filter-tabs {
            position: relative;
            z-index: 10;
            display: flex;
            gap: 12px;
            margin-bottom: 35px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(15px);
            padding: 6px 10px;
            border-radius: 40px;
            border: 1px solid rgba(255, 105, 180, 0.25);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: #ddd;
            font-size: 14px;
            font-weight: bold;
            padding: 8px 18px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .tab-btn:hover {
            color: #fff;
            background: rgba(255, 105, 180, 0.2);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 20, 147, 0.5);
        }

        /* Videos Grid */
        .videos-grid {
            position: relative;
            z-index: 10;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 35px;
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
        }

        /* Single video view modifier */
        .videos-grid.single-view {
            grid-template-columns: 1fr;
            max-width: 640px;
        }

        /* Video Card */
        .video-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 105, 180, 0.25);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), 0 0 35px rgba(255, 105, 180, 0.15);
            transition: transform 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease;
            display: flex;
            flex-direction: column;
            animation: fade-in-up 1s ease-out;
        }

        .video-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 105, 180, 0.6);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), 0 0 45px rgba(255, 105, 180, 0.3);
        }

        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Card Header */
        .card-header {
            padding: 18px 24px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .card-title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card-badge {
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            font-size: 11px;
            text-transform: uppercase;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 20px;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(255, 20, 147, 0.4);
        }

        .card-title {
            font-size: 19px;
            font-weight: bold;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff69b4;
            box-shadow: 0 0 8px #ff69b4;
            animation: pulse-dot 1.8s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        /* Video Wrapper */
        .video-wrapper {
            position: relative;
            width: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 280px;
            max-height: 520px;
            overflow: hidden;
        }

        video {
            width: 100%;
            max-height: 520px;
            height: auto;
            display: block;
            object-fit: contain;
            background: #000;
            outline: none;
        }

        /* Card Footer Controls */
        .card-footer {
            padding: 16px 22px;
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }

        .video-caption {
            font-size: 13px;
            color: #bbb;
            font-style: italic;
        }

        .quick-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 105, 180, 0.3);
            color: #fff;
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 5px;
            font-family: inherit;
        }

        .action-btn:hover {
            background: rgba(255, 105, 180, 0.3);
            border-color: #ff69b4;
            transform: scale(1.05);
            box-shadow: 0 0 12px rgba(255, 105, 180, 0.4);
        }

        .action-btn:active {
            transform: scale(0.97);
        }

        /* Floating Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 30;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .nav-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 12px 22px;
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 0 20px rgba(255, 20, 147, 0.6);
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .nav-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 30px rgba(255, 20, 147, 0.85);
            background: linear-gradient(135deg, #ff1493, #ff69b4);
        }

        /* Responsive styling */
        @media (max-width: 768px) {
            body {
                padding: 25px 14px 100px;
            }

            .page-title {
                font-size: 24px;
            }

            .page-subtitle {
                font-size: 13px;
            }

            .videos-grid {
                grid-template-columns: 1fr;
                gap: 25px;
            }

            .bottom-nav {
                bottom: 15px;
                right: 50%;
                transform: translateX(50%);
                justify-content: center;
                width: 100%;
                padding: 0 10px;
                box-sizing: border-box;
                gap: 8px;
            }

            .nav-btn {
                padding: 10px 16px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <!-- Floating Particles Background -->
    <div class="particles-bg">
        <div class="particle-dot" style="left:8%;animation-duration:12s;animation-delay:0s;"></div>
        <div class="particle-dot" style="left:22%;animation-duration:16s;animation-delay:1.5s;"></div>
        <div class="particle-dot" style="left:38%;animation-duration:11s;animation-delay:0.5s;"></div>
        <div class="particle-dot" style="left:52%;animation-duration:14s;animation-delay:2s;"></div>
        <div class="particle-dot" style="left:68%;animation-duration:13s;animation-delay:3s;"></div>
        <div class="particle-dot" style="left:82%;animation-duration:15s;animation-delay:1s;"></div>
        <div class="particle-dot" style="left:94%;animation-duration:17s;animation-delay:2.5s;"></div>
        <div class="particle-dot" style="left:45%;animation-duration:12s;animation-delay:4s;"></div>
    </div>

    <!-- Header Section -->
    <div class="header-section">
        <h1 class="page-title">✨ Dance Moments with RAYA 💃</h1>
        <p class="page-subtitle">— Precious memories, sweet moves & pure smiles 💖 —</p>
    </div>

    <!-- Filter Tabs -->
    <div class="filter-tabs">
        <button class="tab-btn active" id="tabAll" onclick="filterVideos('all')">🎬 Watch Both</button>
        <button class="tab-btn" id="tabDance1" onclick="filterVideos('dance1')">💃 Dance 1</button>
        <button class="tab-btn" id="tabDance2" onclick="filterVideos('dance2')">✨ Dance 2</button>
    </div>

    <!-- Videos Grid Container -->
    <div class="videos-grid" id="videosGrid">

        <!-- Dance 1 Card -->
        <div class="video-card" id="cardDance1">
            <div class="card-header">
                <div class="card-title-group">
                    <span class="card-badge">Part 1</span>
                    <h2 class="card-title">💃 Dance Video 1</h2>
                </div>
                <div class="status-dot" title="Ready to play"></div>
            </div>

            <div class="video-wrapper">
                <video id="video1" preload="metadata" controls playsinline>
                    <source src="dance1.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>

            <div class="card-footer">
                <span class="video-caption">🌙 dance1.mp4 • Beautiful memory 💖</span>
                <div class="quick-actions">
                    <button class="action-btn" onclick="togglePlayVideo('video1')">⏯ Play/Pause</button>
                    <button class="action-btn" onclick="openFullscreen('video1')">⛶ Fullscreen</button>
                    <button class="action-btn" onclick="toggleMuteVideo('video1')">🔊 Mute</button>
                </div>
            </div>
        </div>

        <!-- Dance 2 Card -->
        <div class="video-card" id="cardDance2">
            <div class="card-header">
                <div class="card-title-group">
                    <span class="card-badge">Part 2</span>
                    <h2 class="card-title">✨ Dance Video 2</h2>
                </div>
                <div class="status-dot" title="Ready to play"></div>
            </div>

            <div class="video-wrapper">
                <video id="video2" preload="metadata" controls playsinline>
                    <source src="dance2.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>

            <div class="card-footer">
                <span class="video-caption">🌟 dance2.mp4 • Special dance 💗</span>
                <div class="quick-actions">
                    <button class="action-btn" onclick="togglePlayVideo('video2')">⏯ Play/Pause</button>
                    <button class="action-btn" onclick="openFullscreen('video2')">⛶ Fullscreen</button>
                    <button class="action-btn" onclick="toggleMuteVideo('video2')">🔊 Mute</button>
                </div>
            </div>
        </div>

    </div>

    <!-- Floating Navigation Bar -->
    <div class="bottom-nav">
        <a href="index.html" class="nav-btn">🏠 Back to Garden</a>
        <a href="song.html" class="nav-btn">🎵 Listen Song</a>
        <a href="letter.html" class="nav-btn">📝 Read Letter</a>
    </div>

    <script>
        const video1 = document.getElementById('video1');
        const video2 = document.getElementById('video2');
        const cardDance1 = document.getElementById('cardDance1');
        const cardDance2 = document.getElementById('cardDance2');
        const videosGrid = document.getElementById('videosGrid');

        // Prevent both videos from playing simultaneously
        video1.addEventListener('play', () => {
            if (!video2.paused) {
                video2.pause();
            }
        });

        video2.addEventListener('play', () => {
            if (!video1.paused) {
                video1.pause();
            }
        });

        // Toggle Play / Pause
        function togglePlayVideo(videoId) {
            const vid = document.getElementById(videoId);
            if (!vid) return;
            if (vid.paused) {
                vid.play();
            } else {
                vid.pause();
            }
        }

        // Fullscreen Toggle
        function openFullscreen(videoId) {
            const vid = document.getElementById(videoId);
            if (!vid) return;
            if (vid.requestFullscreen) {
                vid.requestFullscreen();
            } else if (vid.webkitRequestFullscreen) { /* Safari */
                vid.webkitRequestFullscreen();
            } else if (vid.msRequestFullscreen) { /* IE11 */
                vid.msRequestFullscreen();
            }
        }

        // Mute / Unmute Toggle
        function toggleMuteVideo(videoId) {
            const vid = document.getElementById(videoId);
            if (!vid) return;
            vid.muted = !vid.muted;
        }

        // Filter / Switch tabs
        function filterVideos(filter) {
            // Update active tab buttons
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

            if (filter === 'all') {
                document.getElementById('tabAll').classList.add('active');
                cardDance1.style.display = 'flex';
                cardDance2.style.display = 'flex';
                videosGrid.classList.remove('single-view');
            } else if (filter === 'dance1') {
                document.getElementById('tabDance1').classList.add('active');
                cardDance1.style.display = 'flex';
                cardDance2.style.display = 'none';
                videosGrid.classList.add('single-view');
                if (!video2.paused) video2.pause();
            } else if (filter === 'dance2') {
                document.getElementById('tabDance2').classList.add('active');
                cardDance1.style.display = 'none';
                cardDance2.style.display = 'flex';
                videosGrid.classList.add('single-view');
                if (!video1.paused) video1.pause();
            }
        }
    </script>
</body>
</html>
