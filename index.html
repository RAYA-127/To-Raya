<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Glowing Flower with Butterflies</title>
    </head>
    <body>
        <div class="scene">
            <!-- Main Flower Container -->
            <div class="flower-container">
                <div class="stem"></div>
                <div class="glow-effect"></div>
                <div class="flower">
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="center"></div>
                </div>

                <!-- Left Stem Flower -->
                <div class="stem-flower stem-flower-left">
                    <div class="stem-petal"></div>
                    <div class="stem-petal"></div>
                    <div class="stem-petal"></div>
                    <div class="stem-center"></div>
                </div>

                <!-- Right Stem Flower -->
                <div class="stem-flower stem-flower-right">
                    <div class="stem-petal"></div>
                    <div class="stem-petal"></div>
                    <div class="stem-petal"></div>
                    <div class="stem-center"></div>
                </div>
            </div>

            <!-- Butterflies Container -->
            <div class="butterflies-container">
                <div class="butterfly butterfly-1">
                    <div class="butterfly-body"></div>
                    <div class="wing wing-left"></div>
                    <div class="wing wing-right"></div>
                </div>
                <div class="butterfly butterfly-2">
                    <div class="butterfly-body"></div>
                    <div class="wing wing-left"></div>
                    <div class="wing wing-right"></div>
                </div>
                <div class="butterfly butterfly-3">
                    <div class="butterfly-body"></div>
                    <div class="wing wing-left"></div>
                    <div class="wing wing-right"></div>
                </div>
                <div class="butterfly butterfly-4">
                    <div class="butterfly-body"></div>
                    <div class="wing wing-left"></div>
                    <div class="wing wing-right"></div>
                </div>
                <div class="butterfly butterfly-5">
                    <div class="butterfly-body"></div>
                    <div class="wing wing-left"></div>
                    <div class="wing wing-right"></div>
                </div>
            </div>

            <!-- Floating particles for magic effect -->
            <div class="particles">
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
            </div>
        </div>
        <!-- Navigation Buttons -->
        <div class="link-container">
            <a href="song.html" class="letter-link">🎵 Listen Song</a>
            <a href="videos.html" class="letter-link">💃 Dance Videos</a>
            <a href="letter.html" class="letter-link">📝 Read Letter</a>
            <a href="links.html" class="letter-link">🔗 Links</a>
        </div>
    </body>
</html>
